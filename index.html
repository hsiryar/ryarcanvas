<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RYAR Canvas | Website Development, E-commerce & Digital Marketing</title>
    <meta
      name="description"
      content="RYAR Canvas helps businesses build professional websites, custom e-commerce stores, and targeted Meta and TikTok advertising campaigns."
    />
    <link rel="canonical" href="https://riarcanvas.online/" />
    
    <!-- GitHub Pages SPA Deep Link Restoration -->
    <script>
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://riarcanvas.online/" />
    <meta property="og:title" content="RYAR Canvas | Website Development, E-commerce & Digital Marketing" />
    <meta
      property="og:description"
      content="RYAR Canvas helps businesses build professional websites, custom e-commerce stores, and targeted Meta and TikTok advertising campaigns."
    />
    <meta property="og:image" content="/assets/images/ryar-canvas-logo.png" />
    <meta property="og:site_name" content="RYAR Canvas" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://riarcanvas.online/" />
    <meta name="twitter:title" content="RYAR Canvas | Website Development, E-commerce & Digital Marketing" />
    <meta
      name="twitter:description"
      content="RYAR Canvas helps businesses build professional websites, custom e-commerce stores, and targeted Meta and TikTok advertising campaigns."
    />
    <meta name="twitter:image" content="/assets/images/ryar-canvas-logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/ryar-canvas-logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "RYAR Canvas",
        "url": "https://riarcanvas.online/",
        "logo": "https://riarcanvas.online/assets/images/ryar-canvas-logo.png",
        "description": "Digital agency providing website development, e-commerce stores with custom admin panels, and paid Meta and TikTok advertising.",
        "slogan": "Let's Work Together to Bring Your Ideas to Life.",
        "sameAs": [
          "https://www.instagram.com/ryarcanvas/"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "RYAR Canvas Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Website Development"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "E-commerce Website + Custom Admin Panel"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Digital Marketing (Meta Ads & TikTok Ads)"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-white text-[#181D28] antialiased selection:bg-[#7952E8]/20 selection:text-[#324BB0]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
